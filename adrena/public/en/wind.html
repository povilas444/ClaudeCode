<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta property="og:type" content="website">

<script>try{var t=localStorage.getItem('adrena-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<script>try{if(!sessionStorage.getItem('adrena-loaded')&&!matchMedia('(prefers-reduced-motion: reduce)').matches){document.documentElement.classList.add('is-loading');sessionStorage.setItem('adrena-loaded','1')}}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..700,100;1,9..144,400..700,100&display=swap">
<link rel="stylesheet" href="../assets/css/style.css?v=21">
</head>
<body data-page="wind">
<header id="site-header"></header>

<main>

<section class="page-hero is-weather">
  <svg class="deco deco-wind deco-hero-wind" data-deco aria-hidden="true" viewBox="0 0 320 160"><g fill="none" style="stroke:var(--sun)" stroke-width="8" stroke-linecap="round"><path d="M8 40h200a28 28 0 1 0-28-28"/><path d="M8 80h260a28 28 0 1 1-28 28"/><path d="M48 120h96"/></g></svg>
  <div class="wrap">
    <div class="eyebrow">Wind forecast</div>
    <h1>Wind forecast</h1>
    <p>Live forecast from LHMT for kitesurfing and other sport spots in Lithuania.</p>
  </div>
</section>

<section class="fc-controls-sec">
  <div class="wrap">

    <!-- Spot tabs -->
    <div id="spot-tabs" class="spot-tabs" role="tablist" aria-label="Spot"></div>

    <!-- Controls bar -->
    <div class="wx-controls">
      <div class="wx-sport-wrap">
        <label for="sport-select" class="wx-ctrl-label">Sport</label>
        <select id="sport-select" class="wx-sport-select"></select>
      </div>
      <div class="wx-unit-wrap">
        <span class="wx-ctrl-label">Units</span>
        <div class="wx-unit-toggle">
          <button data-unit="ms" class="on">m/s</button>
          <button data-unit="kn">kn</button>
          <button data-unit="kmh">km/h</button>
        </div>
      </div>
      <div class="wx-refresh-wrap">
        <span id="wx-updated" class="wx-updated"></span>
        <button id="wx-refresh" class="wx-refresh-btn" aria-label="Refresh">↻</button>
      </div>
    </div>

  </div>
</section>

<!-- Summary + best windows -->
<section class="fc-sec">
  <div class="wrap wx-summary-wrap">
    <div id="wx-now"></div>
    <div id="wx-best"></div>
  </div>
</section>

<!-- Forecast table -->
<section class="fc-sec">
  <div class="wrap">
    <h2>Forecast</h2>
  </div>
  <div class="fc-section-clip"><div id="wx-table"></div></div>
  <div class="wrap">
    <p class="wx-credit">Data source: Lithuanian Hydrometeorological Service · <a href="https://api.meteo.lt" target="_blank" rel="noopener">api.meteo.lt</a> · CC BY-SA 4.0</p>
  </div>
</section>

<!-- Wind chart -->
<section class="fc-sec">
  <div class="wrap">
    <h2>Wind chart</h2>
    <div id="wx-chart"></div>
  </div>
</section>

<!-- Legend + safety -->
<section class="fc-sec last">
  <div class="wrap">
    <div id="wx-legend"></div>
  </div>
</section>

</main>

<footer id="site-footer"></footer>
<script src="../assets/js/config.js?v=20"></script>
<script src="../assets/js/spots.js?v=20"></script>
<script src="../assets/js/site.js?v=21"></script>
<script src="../assets/js/forecast.js?v=20"></script>
</body>
</html>
