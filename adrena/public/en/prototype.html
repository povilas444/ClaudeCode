<body data-page="proto">
<header id="site-header"></header>

<main>

<section id="prototipas">
  <div class="wrap demo">
    <div class="demo-side">
      <div class="sec-head">
        <div class="eyebrow">Prototype</div>
        <h1>Try Adrena</h1>
        <p class="lead">This is a working app demo. Tap the phone like a real app or pick a scenario.</p>
      </div>
      <div class="scn" id="scn">
        <button data-scn="signup"><span>Create an account<small>Name, city and favourite activities</small></span></button>
        <button data-scn="quiz"><span>Not sure what to try?<small>Three questions and the activities that suit you</small></span></button>
        <button data-scn="book"><span>Book a kitesurfing lesson<small>Instructor, a time that fits the wind, payment</small></span></button>
        <button data-scn="alert"><span>Get a weather alert<small>The lesson moves to another day</small></span></button>
        <button data-scn="progress"><span>Check your progress<small>Level reached and the next step</small></span></button>
        <button data-scn="community"><span>Community videos<small>Watch and upload your own clip</small></span></button>
      </div>
      <p class="demo-note">All instructors, prices, reviews and weather are examples, and payments are not real. Anything you enter or upload in the demo stays in your browser.</p>
      <button class="reset" id="resetDemo">Restart the demo</button>
    </div>
    <div class="phone-wrap">
      <div class="phone">
        <div class="screen" id="screen">
          <div class="notch"></div>
          <div class="sbar"><span id="clock">9:41</span><i>●●● ▮</i></div>
          <div class="demo-flag">Demo</div>
          <button class="push" id="push" type="button" aria-live="polite"></button>
          <div class="app" id="app"></div>
          <nav class="tabbar" id="tabbar" aria-label="App menu"></nav>
          <div class="toast" id="toast" role="status"></div>
        </div>
      </div>
    </div>
  </div>
</section>

</main>

<footer id="site-footer"></footer>
